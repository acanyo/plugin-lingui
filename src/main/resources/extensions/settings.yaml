apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-lingui-settings
spec:
  forms:
    - group: ai
      label: AI 生成
      formSchema:
        - $formkit: switch
          name: enabled
          label: 启用 AI 生成
          value: false
          help: 只有创作和修改时调用 AI；阅读文章不需要 AI 服务。
        - $formkit: number
          name: maxOutputTokens
          label: 输出 Token 预算
          value: 16384
          min: 1024
          max: 32768
          step: 1024
          validation: required|number|min:1024|max:32768
          help: 在工作台选择生成模型。推理模型可能将思考计入输出预算；复杂组件被截断时可提高预算，请勿超过所选模型允许的上限。
