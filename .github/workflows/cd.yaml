name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v4
    permissions:
      contents: write
    with:
      # pnpm workspace 的锁文件位于仓库根目录。
      ui-path: "."
      pnpm-version: "10.33.0"
      node-version: 24
      java-version: 21
      app-id: app-gwmrhmax
    secrets:
      halo-pat: ${{ secrets.HALO_PAT }}
